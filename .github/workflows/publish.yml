name: Publish

on:
  push:

jobs:
  publish:
    runs-on: self-hosted

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set Maven URL
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "MAVEN_URL=https://maven.axle.coffee/releases" >> $GITHUB_ENV
          else
            echo "MAVEN_URL=https://maven.axle.coffee/snapshots" >> $GITHUB_ENV
          fi

      - name: Build and publish all versions to Maven
        run: |
          chmod +x ./gradlew
          ./gradlew publishAllMaven --stacktrace
        env:
          MAVEN_URL: ${{ env.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_SECRET: ${{ secrets.MAVEN_SECRET }}
